  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1874C9"/><stop offset=".5" stop-color="#1A92DE"/><stop offset="1" stop-color="#FFD93D"/></linearGradient>
  <linearGradient id="bgpad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#1874C9"/><stop offset=".5" stop-color="#1A92DE"/><stop offset="1" stop-color="#FFD93D"/></linearGradient>
  <radialGradient id="sunglow" cx=".85" cy=".95" r=".6"><stop offset="0" stop-color="#FFE08A"/><stop offset=".35" stop-color="#FFD66B" stop-opacity=".75"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/></radialGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A0"/><stop offset="1" stop-color="#FFB84D"/></linearGradient>
