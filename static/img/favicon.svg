</defs><rect width="100" height="100" rx="22" fill="url(#bgpad)"/><g transform="translate(50 50) scale(.86) translate(-50 -50)">
  <path d="M50,11.5 C31.5,11.5 16.5,26.5 16.5,45 C16.5,68.5 50,89 50,89 C50,89 83.5,68.5 83.5,45 C83.5,26.5 68.5,11.5 50,11.5 Z" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
  <g clip-path="url(#pinclip)">
