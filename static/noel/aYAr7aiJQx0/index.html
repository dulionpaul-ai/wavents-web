<style>
  :root { --gold: #f7d36a; --gold2: #ffefb0; --deep: #065FBB; --night: #05070d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--night); color: #fff; overflow: hidden;
    font-family: Nunito, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fx { z-index: 5; } #snow { z-index: 1; }
  .bar { position: fixed; left: 0; right: 0; height: 9vh; background: #000; z-index: 20; transition: height 1.2s ease; }
  .bar.top { top: 0; } .bar.bottom { bottom: 0; }
  body.open .bar { height: 0; }
  .scene { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 22px; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
  .scene.on { opacity: 1; pointer-events: auto; }
  .cinzel { font-family: Cinzel, Georgia, serif; letter-spacing: .08em; }
  .gold { background: linear-gradient(180deg, var(--gold2), var(--gold) 45%, #b8862b 70%, var(--gold2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(247, 211, 106, .45)); }
  #start h1 { font-size: clamp(28px, 8vw, 48px); line-height: 1.15; margin-bottom: 10px; }
  #start p { color: #cfd8e6; font-weight: 700; margin-bottom: 34px; font-size: 17px; }
  .btn { font: 900 18px Nunito, sans-serif; color: #2a1b00; border: 0; border-radius: 999px; padding: 18px 34px;
    background: linear-gradient(180deg, var(--gold2), var(--gold)); box-shadow: 0 0 0 0 rgba(247,211,106,.7);
    animation: pulse 1.8s infinite; cursor: pointer; }
  @media (max-width: 360px) { .btn { font-size: 16px; padding: 16px 22px; } }
  .btn { white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--gold); border: 2px solid rgba(247,211,106,.6); animation: none; font-size: 16px; padding: 13px 24px; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(247,211,106,.6); } 70% { box-shadow: 0 0 0 26px rgba(247,211,106,0); } 100% { box-shadow: 0 0 0 0 rgba(247,211,106,0); } }
  .santa { position: relative; height: 110px; }
  .santa svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .santa .scary { opacity: 0; }
  .santa.morph .scary { opacity: 1; } .santa.morph .kind { opacity: 0; }
  .santa.morph { filter: drop-shadow(0 0 18px rgba(255,0,0,.8)); transform: scale(1.12) !important; }
  #studio .pin { width: 92px; margin-bottom: 18px; transform: translateY(-40px) scale(.7); opacity: 0;
    transition: transform .9s cubic-bezier(.3,1.6,.5,1), opacity .5s; }
  #studio.on .pin { transform: none; opacity: 1; }
  #studio .name { font-size: clamp(24px, 7.2vw, 46px); font-weight: 900; line-height: 1.15; }
  #studio .sub { color: #9fb2c8; letter-spacing: .35em; font-size: 12px; margin: 8px 0; min-height: 1em; }
  .ring { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%;
    border: 2px solid rgba(247,211,106,.85); box-shadow: 0 0 30px rgba(247,211,106,.5); z-index: 9; pointer-events: none;
    animation: ring 1.8s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes ring { to { transform: scale(140); opacity: 0; border-width: .1px; } }
  #trailer .line { font-size: clamp(22px, 6.5vw, 40px); line-height: 1.3; opacity: 0; transform: scale(1.08);
    transition: opacity 1s ease, transform 3s ease; text-shadow: 0 0 30px rgba(255,255,255,.25); }
  #trailer .line.show { opacity: 1; transform: scale(1); }
  #reel .label { color: #cfd8e6; font-weight: 800; letter-spacing: .3em; font-size: 13px; margin-bottom: 18px; }
  #reel .window { position: relative; width: min(86vw, 420px); height: 96px; overflow: hidden; border-radius: 18px;
    border: 3px solid var(--gold); box-shadow: 0 0 40px rgba(247,211,106,.35), inset 0 0 30px rgba(0,0,0,.8); background: #0b1020; }
  #reel .strip { position: absolute; left: 0; right: 0; top: 0; }
  #reel .cell { height: 96px; display: flex; align-items: center; justify-content: center; font: 900 clamp(26px, 8vw, 40px) Cinzel, serif; }
  #reel .window::before, #reel .window::after { content: ""; position: absolute; left: 0; right: 0; height: 30px; z-index: 2; }
  #reel .window::before { top: 0; background: linear-gradient(#0b1020, transparent); }
  #reel .window::after { bottom: 0; background: linear-gradient(transparent, #0b1020); }
  #reel .tease { height: 30px; margin-top: 18px; color: var(--gold); font-weight: 900; font-size: 18px; }
  #gift .box { font-size: 110px; transform: translateY(-120vh); }
  #gift.on .box { animation: drop 1s cubic-bezier(.3,1.5,.5,1) forwards, shake .12s linear 1.2s 30, glow 3.5s ease-in 1s forwards; }
  @keyframes drop { to { transform: none; } }
  @keyframes shake { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
  @keyframes glow { to { filter: drop-shadow(0 0 60px #fff) brightness(1.8); } }
  #gift .count { font: 900 120px Cinzel, serif; height: 140px; margin-top: 10px; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; z-index: 30; pointer-events: none; }
  #flash.go { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  body.shake .scene { animation: quake .5s linear; }
  @keyframes quake { 0%,100% { transform: none; } 20% { transform: translate(-12px, 8px); } 40% { transform: translate(10px, -10px); } 60% { transform: translate(-8px, -6px); } 80% { transform: translate(6px, 8px); } }
  #reveal .pre { color: #cfd8e6; letter-spacing: .35em; font-size: 13px; font-weight: 900; margin-bottom: 14px; }
  #reveal .who { font-size: clamp(44px, 15vw, 96px); font-weight: 900; line-height: 1.05; min-height: 1.1em; }
  #reveal .who span { display: inline-block; opacity: 0; transform: translateY(30px) scale(1.6); filter: blur(8px);
    transition: all .5s cubic-bezier(.3,1.6,.5,1); }
  #reveal .who span.in { opacity: 1; transform: none; filter: none; }
  #reveal .gifts { font-size: 40px; margin: 10px 0 8px; }
  #reveal .info { color: #e8eef6; font-weight: 800; font-size: 17px; margin-top: 6px; }

  #reveal .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .spot { position: fixed; top: -20vh; width: 60vw; height: 140vh; background: radial-gradient(ellipse at top, rgba(255,240,200,.18), transparent 60%);
    z-index: 2; pointer-events: none; opacity: 0; transition: opacity 1s; transform-origin: top center; }
  .spot.on { opacity: 1; animation: sweep 6s ease-in-out infinite alternate; }
  .spot.l { left: -10vw; transform: rotate(18deg); } .spot.r { right: -10vw; transform: rotate(-18deg); animation-delay: -3s; }
  @keyframes sweep { from { transform: rotate(22deg); } to { transform: rotate(-8deg); } }
  #credits { justify-content: flex-start; padding-top: 100vh; }
  #credits.on .roll { animation: roll 16s linear forwards; }
  #credits .roll { color: #cfd8e6; font-weight: 800; line-height: 2; }
  #credits .roll b { color: var(--gold); display: block; letter-spacing: .3em; font-size: 12px; margin-top: 24px; }
  @keyframes roll { to { transform: translateY(-190vh); } }

  #trailer .line.whisper { font-family: Nunito, sans-serif; font-style: italic; color: #cfd8e6; font-size: clamp(20px, 5.5vw, 30px); letter-spacing: .02em; }
  #trailer .line.crisis { color: #ff4d4d; text-shadow: 0 0 30px rgba(255,40,40,.7); }
  #red { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,.0), rgba(160,0,0,.55)); opacity: 0; z-index: 8; pointer-events: none; transition: opacity .4s; }
  #red.on { animation: alarm 1s ease-in-out infinite; }
  @keyframes alarm { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  .news { position: fixed; left: 50%; top: 50%; width: min(84vw, 380px); padding: 16px 18px 18px; background: #f3ead2; color: #1a1a1a;
    font-family: Georgia, serif; text-align: left; box-shadow: 0 20px 60px rgba(0,0,0,.7); z-index: 12; transform: translate(-50%, -50%) rotate(720deg) scale(0);
    animation: spin 1s cubic-bezier(.2,.8,.3,1) forwards; }
  .news small { display: block; font: 900 11px Nunito, sans-serif; letter-spacing: .25em; border-bottom: 2px solid #1a1a1a; padding-bottom: 6px; margin-bottom: 8px; }
  .news strong { display: block; font-size: 26px; line-height: 1.1; text-transform: uppercase; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(var(--r, -4deg)) scale(1); } }
  .mute { position: fixed; right: 14px; top: calc(9vh + 10px); z-index: 25; background: rgba(255,255,255,.08); color: #fff;
    border: 0; border-radius: 999px; width: 40px; height: 40px; font-size: 18px; }
  body.open .mute { top: 14px; }

<script>
// Tirage chiffré (AES-GCM) : la clé n'est que dans le lien (#…), jamais dans
// le dépôt ni sur le serveur.
const PAYLOAD = "6DdLAzX8ldZHT4UmNe-SnRqetyt0Uti0Rb2JT_TJQiIt0YnhNrmaso6J52YiSEXDAenQmpYekAijTpHTr_hKInkxF65NZ4MJpMEs1n6gglF-BDMH6_H-KChTOmoCgoMN2XgiC5RUs8NLThh_zcmYBshIxmls5rwqfY1wJ62I78ZnOdaWXIuUn5sZGH4z6OwA4VLc4Th9hqFYELkJ7ce8LCUZSw3lpg4qjXI6BgOzidh6bMOPgaG8srPVrKkKklrqelFruigVO8aFulnjc_vCLHMs8ailxGZCtqdXNu4h_ZMKIiSFw14S2jWCxzZhA68oxyjubcHh3m6SX6YxcUVN3sI";

const $ = (id) => document.getElementById(id);
// Intitulé du groupe (les pages /noel/ de la famille Jubert n'en ont pas).
const group = () => (data && data.group) || "La famille Jubert";
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const scenes = ["start", "studio", "trailer", "launch", "reel", "gift", "reveal", "credits", "locked"];
function show(id) { scenes.forEach((s) => $(s).classList.toggle("on", s === id)); }
const vibrate = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---- Déchiffrement ---------------------------------------------------------
const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(s.length / 4) * 4, "=")), (c) => c.charCodeAt(0));
// Deux façons de recevoir son tirage : le générateur public
// (/secret-santa/, « #d=… » : la fiche de la personne, encodée dans son seul
// lien) ou une page chiffrée (/noel/…, PAYLOAD + clé dans le lien).
async function decrypt() {
  if (location.hash.startsWith("#d=")) {
    return JSON.parse(new TextDecoder().decode(b64(location.hash.slice(3))));
  }
  const key = location.hash.slice(1);
  if (!key) throw new Error("clé absente");
  const raw = b64(PAYLOAD);
  const k = await crypto.subtle.importKey("raw", b64(key), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, k, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

// ---- Son (synthétisé, aucun fichier) -----------------------------------------
let ac = null, muted = false, master = null;
function audio() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .8; master.connect(ac.destination); }
  return ac;
}
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; if (master) master.gain.value = muted ? 0 : .8; };
function noise(dur, freq, q, vol, t0 = 0) {
  const a = audio(), n = a.createBufferSource(), buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  n.buffer = buf; const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); const t = a.currentTime + t0;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + dur);
}
function tone(freq, dur, type = "sine", vol = .3, t0 = 0, slide = 0) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
const boom = () => { tone(60, 1.8, "sine", .9, 0, 28); noise(1.2, 120, .7, .8); };
const braam = () => { [55, 82.4, 110].forEach((f) => tone(f, 2.6, "sawtooth", .16, 0, f * .97)); noise(2.4, 200, .5, .25); };
const whoosh = () => noise(1.2, 900, .4, .35);
const tick = () => tone(1800, .05, "square", .07);
const chime = () => [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 1.6, "sine", .18, i * .09));
function drumroll(sec) { for (let i = 0; i < sec * 22; i++) noise(.06, 300 + Math.random() * 200, 1.2, .25 + i / (sec * 22) * .35, i / 22); }
function heartbeat() { tone(70, .18, "sine", .8); tone(62, .2, "sine", .6, .22); }
function siren(sec) { const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = "sawtooth"; for (let i = 0; i < sec * 2; i++) { o.frequency.setValueAtTime(620, t + i * .5); o.frequency.linearRampToValueAtTime(950, t + i * .5 + .25); o.frequency.linearRampToValueAtTime(620, t + i * .5 + .5); }
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.07, t + .2); g.gain.setValueAtTime(.07, t + sec - .3); g.gain.exponentialRampToValueAtTime(.0001, t + sec);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + sec + .05); }
function crowd(sec) { for (let i = 0; i < sec * 6; i++) noise(.4, 400 + Math.random() * 600, .6, .12, i / 6); }
function fanfare() { const n = [523, 659, 784, 1047, 784, 1047]; n.forEach((f, i) => { tone(f, .5, "triangle", .22, i * .14); tone(f / 2, .5, "sawtooth", .08, i * .14); }); }

// ---- Neige, feux d'artifice, confettis ---------------------------------------
const snow = $("snow"), sx = snow.getContext("2d"), fx = $("fx"), fc = fx.getContext("2d");
let W, H, dpr = Math.min(2, window.devicePixelRatio || 1);
function resize() { W = innerWidth; H = innerHeight; [snow, fx].forEach((c) => { c.width = W * dpr; c.height = H * dpr; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); }); }
resize(); addEventListener("resize", resize);
const flakes = Array.from({ length: 140 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 2.4 + .6, s: Math.random() * .8 + .3, w: Math.random() * 2 * Math.PI }));
let parts = [];
function burst(x, y, n, colors, speed = 7, gravity = .12, size = 2.6, life = 90) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = Math.random() * speed;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: gravity, c: colors[i % colors.length], s: size * (Math.random() + .5), l: life * (Math.random() * .5 + .75), t: 0, conf: false }); }
}
function confetti(n) {
  const cols = ["#f7d36a", "#ff4d6d", "#4dd4ff", "#7CFF8A", "#ffffff", "#b388ff"];
  for (let i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 2, vy: Math.random() * 2 + 1.5, g: .02,
    c: cols[i % cols.length], s: Math.random() * 6 + 4, l: 400, t: 0, conf: true, r: Math.random() * 6, vr: (Math.random() - .5) * .3 });
}
let fireworksOn = false;
function frame() {
  sx.clearRect(0, 0, W, H); sx.fillStyle = "rgba(255,255,255,.85)";
