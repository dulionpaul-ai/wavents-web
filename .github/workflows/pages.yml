# Génère et publie le site public de Wavents chaque jour (voir README.md).
name: Publier le site

on:
  schedule:
    # Juste après minuit à Paris (22:20 UTC en été, 23:20 UTC en hiver ; les
    # deux tournent, le premier ne change rien en hiver) : sans ça, « aujourd'hui »
    # restait la veille jusqu'à la génération du matin, que GitHub lance
    # souvent avec 3 h de retard (Paul, 19/10 : site encore au 18 à 13 h 40).
    - cron: "20 22 * * *"
    - cron: "20 23 * * *"
    # 05:30 UTC : après l'import de la nuit ; 11:15 UTC : après celui du matin.
    - cron: "30 5 * * *"
    - cron: "15 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Signaler les pages à Bing (IndexNow)
        # Clé publique par conception (fichier 2c29f47b40715616fc2817b79ca473b0.txt à la racine du site).
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request
          urls = json.load(open("site/indexnow.json"))
          body = json.dumps({"host": "wavents.fr", "key": "2c29f47b40715616fc2817b79ca473b0",
                             "keyLocation": "https://wavents.fr/2c29f47b40715616fc2817b79ca473b0.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              print("IndexNow", resp.status, len(urls), "pages")
          PY
